services:
  - type: web
    name: kanplan
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # paste your existing Postgres connection string in the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false          # set to your Render URL, e.g. https://kanplan.onrender.com
      - key: STREAM_API_KEY
        sync: false
      - key: STREAM_API_SECRET
        sync: false
